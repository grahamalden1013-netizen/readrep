# XcodeGen spec — the fallback path.
#
# `ExplainYourself.xcodeproj` is committed and should just open. If it ever gets
# into a state Xcode dislikes (a merge conflict in the pbxproj is the usual
# cause), delete it and run `xcodegen generate` to rebuild an equivalent one
# from this file.
#
#   brew install xcodegen && xcodegen generate

name: ExplainYourself
options:
  bundleIdPrefix: com.explainyourself
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  ExplainYourselfKit:
    path: Packages/ExplainYourselfKit

targets:
  ExplainYourself:
    type: application
    platform: iOS
    sources:
      - path: ExplainYourself
        excludes:
          - "Config/xcconfig/**"
          - "Resources/Info.plist"
          - "Resources/ExplainYourself.entitlements"
    dependencies:
      - package: ExplainYourselfKit
    configFiles:
      Debug: ExplainYourself/Config/xcconfig/Debug.xcconfig
      Release: ExplainYourself/Config/xcconfig/Release.xcconfig
    settings:
      base:
        INFOPLIST_FILE: ExplainYourself/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExplainYourself/Resources/ExplainYourself.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Swift 6 strict concurrency is deliberately off for v1. Turning it on
        # is a worthwhile piece of work, but it is a refactor, not a setting.
        SWIFT_STRICT_CONCURRENCY: minimal

  ExplainYourselfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExplainYourselfTests
    dependencies:
      - target: ExplainYourself
      - package: ExplainYourselfKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.explainyourself.app.tests

schemes:
  ExplainYourself:
    build:
      targets:
        ExplainYourself: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExplainYourselfTests
    archive:
      config: Release
